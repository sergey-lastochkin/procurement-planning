[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name="1c-procurement-control-tower"
version="0.1.0"
requires-python=">=3.11"
description="Deterministic procurement-planning engine combining inventory/demand/incoming with supplier constraints, freshness, explainable scoring, approval, and idempotent draft creation."

[project.optional-dependencies]
dev=["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
addopts="-q"
